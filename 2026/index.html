<body>

<div class="card" id="selection-area">
    <h2>日本さかな検定　最新問2026</h2>
    <h3>出題する問題を選択</h3>
    <p class="selection-intro">解答したい問題番号にチェックを入れてください。全問出題する場合は「全選択」を押してください。</p>
    <div class="selection-actions">
        <button type="button" class="select-all-btn" onclick="selectAllQuestions()">全選択</button>
        <button type="button" class="clear-all-btn" onclick="clearAllQuestions()">全解除</button>
    </div>
    <p class="selection-count" id="selection-count" aria-live="polite">選択中：0 / 100 問</p>
    <div class="question-grid" id="question-selection-grid" aria-label="出題する問題番号"></div>
    <button type="button" class="start-btn" id="start-quiz-btn" onclick="startSelectedQuiz()" disabled>選択した問題を開始</button>
</div>

<div class="card" id="quiz-area" style="display:none;">
    <h2 id="q-number">第 1 問</h2>
    <p id="q-text" style="font-size: 1.2em; font-weight: bold;"></p>
    <img id="q-image" class="quiz-img" src="" alt="問題画像">

    <div class="btn-group" id="ans-btns"></div>

    <div id="ex-box" class="explanation-box">
        <strong id="judge-text" style="font-size: 1.3em;"></strong><br>
        <button class="next-btn" onclick="next()">次の問題へ</button>
        <p id="ex-text"></p>
        <img id="feedback-explanation-img" class="review-explanation-img" src="" alt="解説画像" style="display:none;" onerror="this.style.display='none'">
    </div>
</div>

<div class="card result-screen" id="result-area">
    <h2>結果発表</h2>
    <h1 id="score-rate"></h1>
    <p id="score-detail"></p>
    <div id="wrong-list-area" style="margin-top: 20px;">
        <p><strong>間違えた問題（クリックで解説）：</strong></p>
        <div id="links"></div>
        <button id="retry-wrong-btn" onclick="retryWrong()" style="display:none; background:#ff9800; color:white; margin-top:15px;">間違えた問題だけ解き直す</button>
    </div>
    <div id="review-area" class="review-box">
        <h4>復習モード</h4>
        <button onclick="location.reload()" style="background:#607d8b; color:white;">最初から解き直す</button>
        <button onclick="document.getElementById('review-area').style.display='none'">閉じる</button>
        <p id="review-text"></p>
    </div>
    <br>
</div>

    let current = 0;
    let score = 0;
    let wrongIndices = [];
    let activeQuestions = [];
    let activeOriginalIndices = [];

    const qImg = document.getElementById("q-image");
    const exBox = document.getElementById("ex-box");

    function loadQuiz() {
        const data = activeQuestions[current];
        document.getElementById("q-number").innerText = `第 ${activeOriginalIndices[current] + 1} 問`;
        document.getElementById("q-text").innerText = data.q;
        
        if(data.img) {
            qImg.src = data.img;
            qImg.style.display = "block";
        } else {
            qImg.style.display = "none";
        }
        
        const btnArea = document.getElementById("ans-btns");
        btnArea.innerHTML = "";

        data.options.forEach((option, index) => {
            const btn = document.createElement("button");

            btn.textContent = `${index + 1}. ${option}`;
            btn.onclick = () => check(index);

            btnArea.appendChild(btn);
        });

        exBox.style.display = "none";
        btnArea.style.pointerEvents = "auto";
    }

    function check(userAns) {
        const data = activeQuestions[current];
        const isCorrect = (userAns === data.a);

        document.getElementById("ans-btns").style.pointerEvents = "none";

        const jt = document.getElementById("judge-text");

        if(isCorrect) {
            jt.innerText = "正解！";
            jt.style.color = "#4caf50";
            score++;
        } else {
            jt.innerText = "不正解...";
            jt.style.color = "#f44336";
            wrongIndices.push(activeOriginalIndices[current]);
        }

        document.getElementById("ex-text").innerText =
            `正解：${data.options[data.a]}\n${data.ex}`;

        const feedbackImage = document.getElementById("feedback-explanation-img");
        feedbackImage.style.display = "none";
        feedbackImage.src = `img/${String(activeOriginalIndices[current] + 1).padStart(3, "0")}b.png`;
        feedbackImage.onload = () => { feedbackImage.style.display = "block"; };
        feedbackImage.onerror = () => { feedbackImage.style.display = "none"; };

        exBox.style.display = "block";
    }

    function next() {
        current++;
        if(current < activeQuestions.length) {
            loadQuiz();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("result-area").style.display = "block";
        
        const rate = Math.round((score / activeQuestions.length) * 100);
        document.getElementById("score-rate").innerText = `正答率 ${rate}%`;
        document.getElementById("score-detail").innerText = `${activeQuestions.length}問中 ${score}問正解`;
        
        const linkArea = document.getElementById("links");
        linkArea.innerHTML = "";
        const retryButton = document.getElementById("retry-wrong-btn");
        retryButton.style.display = wrongIndices.length > 0 ? "block" : "none";

        // 追加：全問正解（間違いが0件）のときのみボタンを表示
        const backButton = document.getElementById("back-to-selection-btn");
        if (backButton) {
            backButton.style.display = (wrongIndices.length === 0) ? "block" : "none";
        }

        if(wrongIndices.length === 0) {
            linkArea.innerText = "なし！完璧です。";
        } else {
            wrongIndices.forEach(idx => {
                const span = document.createElement("span");
                span.className = "wrong-link";
                span.innerText = `第${idx + 1}問`;
                span.onclick = () => showReview(idx);
                linkArea.appendChild(span);
            });
        }
    }

    function retryWrong() {
        if (wrongIndices.length === 0) return;

        activeOriginalIndices = [...wrongIndices];
        activeQuestions = activeOriginalIndices.map(idx => quizData[idx]);
        current = 0;
        score = 0;
        wrongIndices = [];

        document.getElementById("result-area").style.display = "none";
        document.getElementById("quiz-area").style.display = "block";
        loadQuiz();
    }

    function backToSelection() {
        document.getElementById("result-area").style.display = "none";
        document.getElementById("selection-area").style.display = "block";
        document.getElementById("review-area").style.display = "none";
        initializeSelectionUI();
    }

    function showReview(idx) {
        const data = quizData[idx];
        const reviewArea = document.getElementById("review-area");

        const explanationImage = `img/${String(idx + 1).padStart(3, "0")}b.png`;
        document.getElementById("review-text").innerHTML = `
            <strong>問題:</strong> ${data.q}<br>
            ${data.img ? `
                <img
                    src="${data.img}"
                    alt="問題の画像"
                    style="display: block; max-width: 100%; height: auto; margin: 10px 0;"
                >
            ` : ""}
            <strong>正解:</strong> ${data.a + 1}. ${data.options[data.a]}<br>
            <strong>解説:</strong> ${data.ex}
            <img
                class="review-explanation-img"
                src="${explanationImage}"
                alt="第${idx + 1}問の解説画像"
                onerror="this.style.display='none'"
            >
        `;
        reviewArea.style.display = "block";
    }

    function initializeSelectionUI() {
        const grid = document.getElementById("question-selection-grid");
        grid.innerHTML = "";
        quizData.forEach((data, index) => {
            const label = document.createElement("label");
            label.className = "question-choice";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = String(index);
            checkbox.setAttribute("aria-label", `第${index + 1}問`);
            checkbox.addEventListener("change", updateSelectionCount);

            const number = document.createElement("span");
            number.textContent = String(index + 1).padStart(3, "0");

            label.appendChild(checkbox);
            label.appendChild(number);
            grid.appendChild(label);
        });
        updateSelectionCount();
    }

    function getSelectedOriginalIndices() {
        return Array.from(document.querySelectorAll("#question-selection-grid input[type='checkbox']:checked"))
            .map(checkbox => Number(checkbox.value))
            .sort((a, b) => a - b);
    }

    function updateSelectionCount() {
        const selectedCount = getSelectedOriginalIndices().length;
        document.getElementById("selection-count").innerText = `選択中：${selectedCount} / ${quizData.length} 問`;
        document.getElementById("start-quiz-btn").disabled = selectedCount === 0;
    }

    function selectAllQuestions() {
        document.querySelectorAll("#question-selection-grid input[type='checkbox']").forEach(checkbox => {
            checkbox.checked = true;
        });
        updateSelectionCount();
    }

    function clearAllQuestions() {
        document.querySelectorAll("#question-selection-grid input[type='checkbox']").forEach(checkbox => {
            checkbox.checked = false;
        });
        updateSelectionCount();
    }

    function startSelectedQuiz() {
        const selectedIndices = getSelectedOriginalIndices();
        if (selectedIndices.length === 0) {
            alert("出題する問題を1問以上選択してください。");
            return;
        }

        activeOriginalIndices = selectedIndices;
        activeQuestions = activeOriginalIndices.map(index => quizData[index]);
        current = 0;
        score = 0;
        wrongIndices = [];

        document.getElementById("selection-area").style.display = "none";
        document.getElementById("result-area").style.display = "none";
        document.getElementById("quiz-area").style.display = "block";
        document.getElementById("review-area").style.display = "none";
        loadQuiz();
    }

    initializeSelectionUI();
</script>
